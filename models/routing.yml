# preferred = which AI handles the agent. In manual mode this tells you where to paste the prompt.
agents:
  orchestrator: {preferred: claude}
  listings:     {preferred: claude}
  orders:       {preferred: claude}
  messages:     {preferred: gemini}
  finance:      {preferred: claude}
  compliance:   {preferred: claude}
  reviewer:     {preferred: gemini}
  monitor:      {preferred: claude}
  techsupport:  {preferred: claude, max_tokens: 3000}
  research:     {preferred: gemini}
  sourcing:     {preferred: gemini}
  facebook:     {preferred: claude}
  instagram:    {preferred: claude}
  tiktok:       {preferred: claude}
  pinterest:    {preferred: claude}
  marketing:    {preferred: gemini}
  pricing:      {preferred: gemini}
  inventory:    {preferred: gemini}
  returns:      {preferred: claude}
  analytics:    {preferred: gemini}
models:
  claude:
    provider: anthropic
    model: claude-sonnet-5-5       # check docs.claude.com for current model names
    max_tokens: 1500
    paste_into: https://claude.ai
  gemini:
    provider: gemini
    model: gemini-3.8-flash        # check Google AI Studio for current model names
    max_tokens: 1500
    paste_into: https://aistudio.google.com
