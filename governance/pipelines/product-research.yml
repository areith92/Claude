name: product-research
cadence: manual at first (weekly once trusted)
niche: new-baby and expectant-parent gifting, UK only (decision 0010)
data_sources:
  - Etsy public listings through the Etsy API (Seller App), within its caching rules
  - eBay live listings through the Browse API, shown for the owner to judge and deleted after the run; never used to suggest or model prices
  - the owner's own Seller Hub research (Terapeak), entered by hand
  - UK web search for suppliers, brands, safety guidance and gift trends, with the source and date kept
stages:
  - agent: sourcing
    task: For each candidate product, name the lane (ebay_resale, etsy_gift_box, etsy_designed or etsy_personalised) and the supplier (a UK wholesaler, a UK brand or the production partner). Record trade cost, delivery cost, minimum order, lead time and which safety documents the supplier can provide. Reject anything that needs importing or an overseas marketplace.
  - agent: merchandiser
    task: Build the gift box or bundle, write the eBay UK and Etsy UK listing drafts in the lane's format with every required disclosure and label line, and propose a cost-plus price that clears the minimum margin after the channel's fees.
  - agent: finance-insights
    task: Work out profit after the channel's full fee stack, postage, packaging and the returns allowance. Reject anything under the minimum margin or over the stock budget.
  - agent: compliance
    task: Run the children's product checklist and the channel rules. List exactly which documents, labels or wording are missing. Block anything in a Stage 2 category while Stage 2 is off.
  - agent: reviewer
    task: Give an independent second opinion on what is left, in a fresh context, naming at least one thing the others may have missed.
  - approval: owner
    via: Approve or Deny on the dashboard (a pull request until the dashboard page exists)
rules:
  max_products_per_run: 20
  min_margin_pct: 30
  max_supplier_delivery_days: 5
  max_production_partner_days: 7
  first_order_cap_gbp: 300
  allowed_fulfilment_models: [hold_stock, production_partner]
  excluded: [cars and car parts, imports, overseas marketplaces, second-hand items, Stage 2 health products while switched off]
  approved_suppliers_skip_approval: true
