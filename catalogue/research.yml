# Rules for the product research pipeline (scripts/research.py and scripts/policy_gate.py). Owner edits by pull request.
# Niche: UK new-baby and expectant-parent gifting (decision 0010). Sourcing: Route A, UK stock plus one UK production partner.
niche: new-baby and expectant-parent gifting, UK only
max_products_per_run: 20
min_margin_pct: 30
stress_cost_increase_pct: 10        # flag it if the margin would fall below the minimum when cost rises by this much
max_supplier_delivery_days: 5       # stock replenishment from a UK wholesaler or brand to you
max_production_partner_days: 7      # order to dispatch for a personalised or original-design item; the listing must state it
research_freshness_days: 7
first_order_cap_gbp: 300            # the first stock order; the monthly stock cap lives in governance/budgets.yml
stage2_health_products:
  enabled: false                    # owner switches on later, eBay only, one product at a time through the gate
  channels: [ebay-uk]
product_lanes:                      # which lane a product sits in; the compliance gate checks the lane's rules
  ebay_resale:          "wholesale item from a UK brand or wholesaler, sold as it is"
  etsy_gift_box:        "curated gift box: different item types, more than one brand, every item listed"
  etsy_designed:        "our original design (AI-assisted designs disclosed), made by a disclosed production partner"
  etsy_personalised:    "buyer's own text or image, made by a disclosed production partner"
allowed_fulfilment_models:          # hold_stock = stock in your hands; production_partner = a UK partner makes and ships your design or the buyer's personalisation
  ebay-uk: [hold_stock, production_partner]
  etsy-uk: [hold_stock, production_partner]
  social:  [hold_stock, production_partner]
seed_keywords:                      # starting points for the research agent; it adds its own within the niche
  - new baby gift box
  - newborn gift set
  - baby shower gift
  - mum to be gift box
  - personalised baby bodysuit
  - baby name bodysuit
  - newborn sleepsuit set
  - wooden baby rattle
