# Dashboard layout. Which agents sit in which department, plus each department's colour and tools.
# Every agent in governance/status.yml must appear once here (the tests check this). The conductor plans the run and belongs to the company routine.
conductor: chief-of-staff
departments:
  sales:      {label: Sales,         color: "#ff4d6d", agents: [merchandiser],          tools: [eBay UK listings, Etsy UK listings, Gift box builder, Catalogue]}
  operations: {label: Operations,    color: "#22d3ee", agents: [fulfilment],            tools: [eBay and Etsy orders, Stock in hand, Production partner orders, Courier tracking]}
  customer:   {label: Customer care, color: "#3b82f6", agents: [customer-care],         tools: [eBay messages, Etsy messages, Social inbox, Reply templates]}
  finance:    {label: Finance,       color: "#34d399", agents: [finance-insights],      tools: [Margin calculator, Cost log, Stock budget, Accountant pack]}
  compliance: {label: Compliance,    color: "#a78bfa", agents: [compliance, reviewer],  tools: [Children's product checklist, Policies, Approval tiers]}
  monitoring: {label: Monitoring,    color: "#fbbf24", agents: [],                      tools: [Health checks, Budget guard, Kill switch]}
  research:   {label: Research,      color: "#2dd4bf", agents: [sourcing],              tools: [Supplier packs, Research runs, Compliance gate]}
  marketing:  {label: Marketing,     color: "#f472b6", agents: [marketing],             tools: [Content calendar, Ad budget (100 GBP a month), Engagement figures]}
  support:    {label: Tech Support,  color: "#fb923c", agents: [tech-support],          tools: [Incident queue, Test sandbox]}
